name: Deploy viz to GitHub Pages

# Builds the in-repo visualiser (viz/ → viz-dist/, a self-contained static bundle)
# and publishes it to GitHub Pages. The library source is never modified: esbuild
# bundles viz/src/main.ts, which imports the real shipped kernel from src/ by path.

on:
  push:
    branches: [main]
    paths:
      - 'viz/**'
      - 'src/**'
      - 'fixtures/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run viz:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viz-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
