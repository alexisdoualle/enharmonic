name: CI

# The accuracy gate. Runs on every PR to main (and on main itself so the check
# has a baseline). Pure Node — no Python, no external services.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build          # typecheck (tsc)
      - run: npm test               # unit tests + the fixture accuracy gate
      - run: npm run viz:build      # the viz must still compile
